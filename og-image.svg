<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" preserveAspectRatio="xMidYMid slice">
  <!-- Margins social card. 1200x630 — Open Graph + Twitter standard. -->

  <!-- Warm cream background matching app bg -->
  <rect width="1200" height="630" fill="#faf7f2"/>

  <!-- Faint diagonal (Kandinsky vocabulary) -->
  <line x1="60" y1="560" x2="1140" y2="80" stroke="#1a1612" stroke-width="0.8" opacity="0.18"/>

  <!-- Cobalt sweeping arc -->
  <path d="M 80 240 Q 600 480 1120 200" fill="none" stroke="#2c5aa0" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

  <!-- Hero composition: yellow disc + vermillion + ink core -->
  <g style="mix-blend-mode: multiply;">
    <circle cx="940" cy="280" r="148" fill="#f0c14b"/>
    <circle cx="940" cy="280" r="84" fill="#d63a2f"/>
    <circle cx="940" cy="280" r="26" fill="#1a1612"/>
  </g>

  <!-- Open ink triangle -->
  <polygon points="180,420 480,470 280,600" fill="none" stroke="#1a1612" stroke-width="3" stroke-linejoin="round"/>

  <!-- Scatter dots -->
  <circle cx="220" cy="200" r="16" fill="#6a4f8c"/>
  <circle cx="1080" cy="510" r="11" fill="#6fa863"/>
  <circle cx="110" cy="520" r="8" fill="#d63a2f"/>
  <circle cx="1130" cy="560" r="6" fill="#1a1612"/>
  <circle cx="600" cy="120" r="5" fill="#1a1612"/>

  <!-- Brand mark + wordmark (top-left) -->
  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="6" height="42" fill="#1a1612"/>
    <circle cx="32" cy="22" r="19" fill="#f0c14b"/>
    <circle cx="32" cy="22" r="12" fill="#d63a2f"/>
    <circle cx="32" cy="22" r="4" fill="#1a1612"/>
    <text x="64" y="32"
      font-family="Manrope, -apple-system, sans-serif"
      font-size="28" font-weight="700" fill="#1a1612"
      letter-spacing="-0.6">margins</text>
  </g>

  <!-- Headline (two lines, matches landing) -->
  <g transform="translate(80, 280)">
    <text font-family="Manrope, -apple-system, sans-serif"
      font-size="80" font-weight="600" fill="#1a1612" letter-spacing="-2">
      <tspan x="0" y="0">Your files, organized</tspan>
      <tspan x="0" y="92">for <tspan fill="#d63a2f" text-decoration="underline">your AI</tspan>.</tspan>
    </text>
  </g>

  <!-- Sub-line -->
  <text x="80" y="540"
    font-family="Manrope, -apple-system, sans-serif"
    font-size="22" font-weight="500" fill="#847a6b" letter-spacing="-0.3">
    Plain markdown on your computer. Bring any AI.
  </text>
</svg>
