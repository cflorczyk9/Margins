<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <style>
      .bg     { fill: #faf7f2; }
      .ink    { fill: #1a1612; }
      .ink-st { stroke: #1a1612; fill: none; }
      .vermil { fill: #d63a2f; }
      .mustard{ fill: #f0c14b; }
      .cobalt { stroke: #2c5aa0; fill: none; }
      .h1 {
        font-family: 'Newsreader', 'Cambria', 'Georgia', serif;
        font-weight: 500;
        font-size: 78px;
        letter-spacing: -0.012em;
        fill: #1a1612;
      }
      .sub {
        font-family: 'Manrope', 'Helvetica Neue', -apple-system, sans-serif;
        font-weight: 500;
        font-size: 26px;
        letter-spacing: -0.003em;
        fill: #4a423a;
      }
      .word {
        font-family: 'Manrope', 'Helvetica Neue', -apple-system, sans-serif;
        font-weight: 700;
        font-size: 26px;
        letter-spacing: -0.005em;
        fill: #1a1612;
      }
      .foot {
        font-family: 'Manrope', 'Helvetica Neue', -apple-system, sans-serif;
        font-weight: 600;
        font-size: 18px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        fill: #847a6b;
      }
      .disc { mix-blend-mode: multiply; }
    </style>
  </defs>

  <!-- Paper background -->
  <rect class="bg" width="1280" height="640"/>

  <!-- Light mode mark, right-hand side -->
  <g transform="translate(780,96) scale(6.6)" fill="none" fill-rule="evenodd" stroke-linecap="round" stroke-linejoin="round">
    <rect x="8" y="8" width="48" height="48" rx="11" fill="#faf7f2" stroke="#1a1612" stroke-width="4"/>
    <path stroke="#1a1612" stroke-width="7" d="M19 15v34"/>
    <path fill="#2c5aa0" d="M30.8 18.4c7.4-4.6 17.5-.2 19.4 8.2 2.1 9.1-5.2 19.6-14.8 19.6-8.5 0-14.9-8.3-12.9-16.3 1.1-4.7 4.4-9.1 8.3-11.5Z"/>
    <path fill="#f0c14b" d="M33.1 23.3c5.1-3.4 12.1-.8 13.9 4.9 1.8 6.2-3 13.7-9.5 13.8-5.8.1-10.4-5.4-9.4-11 .5-3.3 2.3-6 5-7.7Z"/>
    <path fill="#d63a2f" d="M36.2 27.4c2.8-1.9 6.8-.5 7.8 2.7 1 3.4-1.8 7.5-5.4 7.5-3.1.1-5.8-2.8-5.3-5.9.3-1.8 1.3-3.3 2.9-4.3Z"/>
    <circle cx="39" cy="33" r="2.4" fill="#1a1612"/>
  </g>

  <!-- Margins wordmark -->
  <g transform="translate(72,52)">
    <g transform="scale(0.78)" fill="none" fill-rule="evenodd" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="8" width="48" height="48" rx="11" fill="#faf7f2" stroke="#1a1612" stroke-width="4"/>
      <path stroke="#1a1612" stroke-width="7" d="M19 15v34"/>
      <path fill="#2c5aa0" d="M30.8 18.4c7.4-4.6 17.5-.2 19.4 8.2 2.1 9.1-5.2 19.6-14.8 19.6-8.5 0-14.9-8.3-12.9-16.3 1.1-4.7 4.4-9.1 8.3-11.5Z"/>
      <path fill="#f0c14b" d="M33.1 23.3c5.1-3.4 12.1-.8 13.9 4.9 1.8 6.2-3 13.7-9.5 13.8-5.8.1-10.4-5.4-9.4-11 .5-3.3 2.3-6 5-7.7Z"/>
      <path fill="#d63a2f" d="M36.2 27.4c2.8-1.9 6.8-.5 7.8 2.7 1 3.4-1.8 7.5-5.4 7.5-3.1.1-5.8-2.8-5.3-5.9.3-1.8 1.3-3.3 2.9-4.3Z"/>
      <circle cx="39" cy="33" r="2.4" fill="#1a1612"/>
    </g>
    <text x="64" y="37" class="word">margins</text>
  </g>

  <!-- Headline -->
  <g transform="translate(72,290)">
    <text x="0" y="0" class="h1">Bring Claude</text>
    <text x="0" y="86" class="h1">to your files.</text>
  </g>

  <!-- Subtitle -->
  <text x="72" y="490" class="sub">Margins makes Claude smarter by turning your</text>
  <text x="72" y="526" class="sub">messy files into usable context.</text>

  <!-- Footer chip row -->
  <g transform="translate(72,590)">
    <text x="0" y="0" class="foot">Free MCP connector  ·  Runs locally  ·  No API key</text>
  </g>
</svg>
