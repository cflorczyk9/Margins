# Netlify deploy config for Margins.
#
# Margins runs entirely in the browser — no backend, no server-side
# state, just static HTML/CSS/JS plus the npm-installed runtime deps
# (mammoth for DOCX, pdfjs-dist for PDF extraction). `node_modules/`
# is gitignored, so the build step installs production deps fresh,
# then the repo root publishes verbatim.
#
# Dev dependency (playwright-core) is skipped via --omit=dev — it's
# only used by the Playwright smoke tests, not by the runtime.

[build]
  command = "npm install --omit=dev --no-audit --no-fund --loglevel=error"
  publish = "."

# Cache the install so subsequent builds skip when package-lock is
# unchanged.
[build.environment]
  NPM_FLAGS = "--no-audit --no-fund"

# Long-cache the immutable deps; short-cache the HTML so updates ship.
[[headers]]
  for = "/node_modules/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# FS Access API requires secure context — Netlify provides HTTPS
# automatically. No special config needed.
