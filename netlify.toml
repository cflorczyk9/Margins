# Netlify deploy config for marginsmcp.com.
#
# Static site. Single HTML landing + one shell install script. No build step,
# no node_modules to ship, no asset pipeline.

[build]
  publish = "web"

# Bare `/install` serves the shell script so users can do:
#   curl -fsSL https://marginsmcp.com/install | bash
[[redirects]]
  from = "/install"
  to = "/install.sh"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    # No X-Frame-Options: LinkedIn's link previews and in-app browser render
    # the page inside an iframe and show "This content is blocked" when XFO
    # is set. Marketing site with no forms, login, or state-changing UI, so
    # nothing to clickjack.
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Serve install.sh as text/plain so curl sees raw bash, not octet-stream.
[[headers]]
  for = "/install.sh"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=300"
