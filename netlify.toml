# Netlify deploy config for Margins.
#
# Margins runs entirely in the browser. Runtime deps (mammoth for
# DOCX extraction, pdfjs-dist for PDF text) are loaded from jsdelivr
# CDN, so the deploy is a pure-static publish — no build step, no
# `npm install`, no `node_modules/` to ship.

[build]
  publish = "."

# Short-cache the HTML so iterating on the landing/app ships quickly.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# FS Access API requires secure context — Netlify provides HTTPS
# automatically. No special config needed.
