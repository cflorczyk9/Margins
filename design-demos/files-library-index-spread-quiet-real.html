<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Files — Spread · Quiet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #faf7f2;
      --paper: #ffffff;
      --paper-soft: #f5f1ea;
      --ink: #1a1612;
      --ink-2: #4a423a;
      --muted: #847a6b;
      --faint: #a89e8d;
      --line: #ece6da;
      --line-strong: #ddd5c4;
      --accent: #d63a2f;
      --accent-soft: rgba(214, 58, 47, 0.10);
      --accent-line: rgba(214, 58, 47, 0.22);

      /* polychrome tokens unchanged (do not modify token values),
         but Index headings use the -quiet variants below for 25% desat */
      --vermillion: #d63a2f;
      --cobalt:     #2c5aa0;
      --mustard:    #c79a26;
      --violet:     #6a4f8c;
      --green-poly: #5d9656;
      --ink-poly:   #1a1612;

      /* Desaturated heading colors (~25% less chroma) — used ONLY on bucket headings.
         Tag pills, connection pills, and bucket dots keep the saturated tokens. */
      --vermillion-quiet: #b35148;
      --cobalt-quiet:     #506f9c;
      --mustard-quiet:    #a89047;
      --violet-quiet:     #7c6c91;
      --green-quiet:      #71926d;
      --ink-quiet:        #3a342c;

      --vermillion-soft: rgba(214, 58, 47, 0.08);
      --cobalt-soft:     rgba(44, 90, 160, 0.08);
      --mustard-soft:    rgba(199, 154, 38, 0.10);
      --violet-soft:     rgba(106, 79, 140, 0.09);
      --green-soft:      rgba(93, 150, 86, 0.09);
      --ink-soft:        rgba(26, 22, 18, 0.05);

      --r-sm: 6px;
      --r-md: 8px;
      --r-lg: 12px;
      --r-pill: 999px;

      --focus-ring: 0 0 0 3px rgba(214, 58, 47, 0.10);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      line-height: 1.5;
    }
    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 56px 32px 120px;
    }

    /* ==== Header ==== */
    .lib-head { margin-bottom: 36px; }
    .lib-kicker {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .lib-kicker::after {
      content: ""; flex: 1; height: 1px;
      background: var(--line); margin-left: 6px;
    }
    .lib-title {
      font-family: 'Manrope', sans-serif;
      font-size: 44px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin: 0;
      line-height: 1.05;
    }

    /* ==== Spread layout ==== */
    .spread {
      display: grid;
      grid-template-columns: 520px 640px;
      gap: 48px;
      margin: 36px 0 0;
      padding: 36px 0 0;
      border-top: 1px solid var(--line);
      align-items: start;
    }

    /* ---- LEFT: Index ---- */
    .index-col { min-width: 0; }

    .index-toprow {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    .index-eyebrow {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      flex-shrink: 0;
    }
    .index-search {
      flex: 1;
      position: relative;
    }
    .index-search input {
      width: 100%;
      font-family: inherit;
      font-size: 13px;
      color: var(--ink);
      padding: 7px 12px 7px 30px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--r-pill);
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .index-search input::placeholder { color: var(--faint); }
    .index-search input:focus {
      border-color: var(--accent-line);
      box-shadow: var(--focus-ring);
    }
    .index-search .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 13px; height: 13px;
      color: var(--faint);
      pointer-events: none;
    }

    /* One-line, italic pull-quote — bare facts only */
    .index-pull {
      font-family: 'Manrope', sans-serif;
      font-style: italic;
      font-size: 13px;
      line-height: 1.4;
      color: var(--muted);
      margin: 6px 0 36px;
      letter-spacing: -0.005em;
    }

    .index-stack {
      display: flex;
      flex-direction: column;
      gap: 36px;
    }
    .bucket { min-width: 0; }
    .bucket-head {
      cursor: pointer;
      user-select: none;
      display: inline-flex;
      align-items: baseline;
      gap: 10px;
      position: relative;
      padding-bottom: 2px;
    }
    .bucket-name {
      font-family: 'Manrope', sans-serif;
      font-size: 19px;
      font-weight: 600;
      letter-spacing: -0.015em;
      margin: 0;
      line-height: 1.15;
    }
    /* Desaturated polychrome for bucket headings */
    .b-entities  .bucket-name { color: var(--cobalt-quiet); }
    .b-concepts  .bucket-name { color: var(--violet-quiet); }
    .b-sources   .bucket-name { color: var(--mustard-quiet); }
    .b-synthesis .bucket-name { color: var(--vermillion-quiet); }
    .b-career    .bucket-name { color: var(--green-quiet); }
    .b-meta      .bucket-name { color: var(--ink-quiet); }

    .bucket-head::after {
      content: "";
      position: absolute;
      left: 50%; right: 50%;
      bottom: -2px;
      height: 1px;
      background: currentColor;
      transition: left 0.25s ease, right 0.25s ease, opacity 0.2s ease;
      opacity: 0;
    }
    .bucket-head:hover::after { left: 0; right: 0; opacity: 0.6; }

    .bucket-count {
      font-size: 11px;
      font-weight: 500;
      color: var(--faint);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.01em;
      white-space: nowrap;
    }

    .bucket-list {
      list-style: none;
      padding: 14px 0 0;
      margin: 0;
    }
    .bucket-item {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: baseline;
      gap: 12px;
      padding: 6px 10px;
      margin: 0 -10px;
      border-radius: var(--r-sm);
      cursor: pointer;
      transition: background 0.15s ease, transform 0.18s ease, opacity 0.18s ease;
      color: var(--ink);
      position: relative;
    }
    .bucket-item:hover { transform: translateX(3px); }
    .b-entities  .bucket-item:hover { background: var(--cobalt-soft); }
    .b-concepts  .bucket-item:hover { background: var(--violet-soft); }
    .b-sources   .bucket-item:hover { background: var(--mustard-soft); }
    .b-synthesis .bucket-item:hover { background: var(--vermillion-soft); }
    .b-career    .bucket-item:hover { background: var(--green-soft); }
    .b-meta      .bucket-item:hover { background: var(--ink-soft); }

    .bucket-item.is-active {
      background: var(--paper) !important;
      box-shadow: inset 2px 0 0 currentColor;
    }
    .b-entities  .bucket-item.is-active { color: var(--cobalt); }
    .b-concepts  .bucket-item.is-active { color: var(--violet); }
    .b-sources   .bucket-item.is-active { color: var(--mustard); }
    .b-synthesis .bucket-item.is-active { color: var(--vermillion); }
    .b-career    .bucket-item.is-active { color: var(--green-poly); }
    .b-meta      .bucket-item.is-active { color: var(--ink-poly); }

    .bucket-item.is-active .item-title { color: inherit; font-weight: 600; }

    .item-title {
      font-family: 'Manrope', sans-serif;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: -0.005em;
      color: var(--ink);
      line-height: 1.3;
      display: block;
    }
    .item-path {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--faint);
      letter-spacing: -0.01em;
      margin-top: 2px;
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .item-age {
      font-size: 11px;
      color: var(--faint);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.01em;
      white-space: nowrap;
      align-self: start;
      padding-top: 3px;
    }

    /* search dim / glow */
    .bucket-item.dim { opacity: 0.28; }
    .bucket-item.glow {
      background: var(--accent-soft) !important;
      box-shadow: inset 2px 0 0 var(--accent);
    }
    .bucket-item.glow .item-title { color: var(--accent); font-weight: 600; }

    /* connection-pill hover highlight */
    .bucket-item.conn-highlight {
      background: var(--accent-soft) !important;
      transform: translateX(3px);
    }

    /* ---- RIGHT: Preview pane ---- */
    .preview-col { min-width: 0; }
    .preview {
      position: sticky;
      top: 24px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      padding: 36px 36px 28px;
      min-height: 520px;
      display: flex;
      flex-direction: column;
    }

    .preview-empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--muted);
      padding: 40px 20px;
    }
    .preview-empty .empty-mark {
      width: 40px; height: 40px;
      border: 1px dashed var(--line-strong);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: var(--faint);
      margin-bottom: 20px;
    }
    .preview-empty .empty-prompt {
      font-family: 'Manrope', sans-serif;
      font-style: italic;
      font-size: 16px;
      color: var(--ink-2);
      margin: 0;
      letter-spacing: -0.005em;
    }

    .preview-active { display: none; flex-direction: column; flex: 1; }
    .preview.has-file .preview-empty { display: none; }
    .preview.has-file .preview-active { display: flex; }

    .preview-title {
      font-family: 'Manrope', sans-serif;
      font-size: 27px;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin: 0 0 4px;
      color: var(--ink);
    }
    .preview-path {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      color: var(--faint);
      letter-spacing: -0.01em;
      margin: 0 0 26px;
    }

    .preview-excerpt {
      font-size: 16px;
      line-height: 1.65;
      color: var(--ink-2);
      margin: 0;
      max-width: 540px;
    }
    .preview-extended {
      display: none;
      font-size: 15px;
      line-height: 1.65;
      color: var(--ink-2);
      margin: 16px 0 0;
      padding-left: 14px;
      border-left: 1px solid var(--accent-line);
      max-width: 540px;
    }
    .preview.is-expanded .preview-extended { display: block; }

    /* Hover-revealed actions: only visible when cursor is in the preview pane */
    .preview-actions {
      position: absolute;
      top: 16px;
      right: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      transform: translateY(-2px);
      transition: opacity 0.18s ease, transform 0.18s ease;
      pointer-events: none;
    }
    .preview:hover .preview-actions,
    .preview:focus-within .preview-actions,
    .preview.is-pinned .preview-actions {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    .more-btn,
    .pin-btn {
      background: transparent;
      border: 1px solid var(--line);
      border-radius: var(--r-pill);
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 500;
      color: var(--muted);
      cursor: pointer;
      padding: 4px 10px;
      transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }
    .more-btn:hover { color: var(--ink); border-color: var(--line-strong); }
    .pin-btn {
      width: 28px; height: 28px;
      padding: 0;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .pin-btn svg { width: 12px; height: 12px; }
    .pin-btn:hover { color: var(--ink); border-color: var(--line-strong); }
    .preview.is-pinned .pin-btn {
      background: var(--accent-soft);
      border-color: var(--accent-line);
      color: var(--accent);
      transform: rotate(-25deg);
    }
    .preview.is-expanded .more-btn { color: var(--accent); border-color: var(--accent-line); }

    .preview-meta-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 10px;
      margin: 28px 0 0;
      padding-top: 22px;
      border-top: 1px solid var(--line);
    }
    .meta-text {
      font-size: 12px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .meta-text strong { color: var(--ink-2); font-weight: 600; }
    .meta-dot {
      width: 3px; height: 3px;
      border-radius: 50%;
      background: var(--line-strong);
    }
    .tag {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: var(--r-pill);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.02em;
      border: 1px solid transparent;
      white-space: nowrap;
    }
    .tag-career         { color: var(--green-poly); background: rgba(93,150,86,0.10);  border-color: rgba(93,150,86,0.22); }
    .tag-advisor        { color: var(--green-poly); background: rgba(93,150,86,0.06);  border-color: rgba(93,150,86,0.16); }
    .tag-consulting     { color: var(--green-poly); background: rgba(93,150,86,0.06);  border-color: rgba(93,150,86,0.16); }
    .tag-product        { color: var(--violet);     background: rgba(106,79,140,0.08); border-color: rgba(106,79,140,0.18); }
    .tag-security       { color: var(--violet);     background: rgba(106,79,140,0.05); border-color: rgba(106,79,140,0.14); }
    .tag-briefly-vision { color: var(--violet);     background: rgba(106,79,140,0.05); border-color: rgba(106,79,140,0.14); }
    .tag-strategy       { color: var(--vermillion); background: rgba(214,58,47,0.08);  border-color: rgba(214,58,47,0.18); }
    .tag-architecture   { color: var(--vermillion); background: rgba(214,58,47,0.05);  border-color: rgba(214,58,47,0.14); }
    .tag-briefly        { color: var(--vermillion); background: rgba(214,58,47,0.05);  border-color: rgba(214,58,47,0.14); }
    .tag-firm           { color: var(--cobalt);     background: rgba(44,90,160,0.08);  border-color: rgba(44,90,160,0.18); }
    .tag-prospect       { color: var(--cobalt);     background: rgba(44,90,160,0.05);  border-color: rgba(44,90,160,0.14); }
    .tag-centric        { color: var(--cobalt);     background: rgba(44,90,160,0.05);  border-color: rgba(44,90,160,0.14); }
    .tag-source         { color: var(--mustard);    background: rgba(199,154,38,0.12); border-color: rgba(199,154,38,0.24); }
    .tag-meeting        { color: var(--mustard);    background: rgba(199,154,38,0.10); border-color: rgba(199,154,38,0.22); }
    .tag-pricing        { color: var(--mustard);    background: rgba(199,154,38,0.08); border-color: rgba(199,154,38,0.18); }
    .tag-mentor         { color: var(--violet);     background: rgba(106,79,140,0.08); border-color: rgba(106,79,140,0.18); }
    .tag-riviera        { color: var(--violet);     background: rgba(106,79,140,0.05); border-color: rgba(106,79,140,0.14); }
    .tag-log            { color: var(--muted);      background: var(--paper-soft);     border-color: var(--line); }
    .tag-meta           { color: var(--muted);      background: var(--paper-soft);     border-color: var(--line); }
    .tag-default        { color: var(--ink-2);      background: var(--paper-soft);     border-color: var(--line); }

    /* Tag overflow chip — same shape, neutral palette */
    .tag-overflow {
      cursor: pointer;
      color: var(--muted);
      background: var(--paper-soft);
      border-color: var(--line);
      font-weight: 500;
    }
    .tag-overflow:hover { color: var(--ink); border-color: var(--line-strong); }

    .preview-connect {
      margin-top: 28px;
    }
    .connect-label {
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .connect-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .conn-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px 5px 11px;
      border-radius: var(--r-pill);
      background: var(--paper);
      border: 1px solid var(--line);
      font-size: 12.5px;
      font-weight: 500;
      color: var(--ink-2);
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
      text-decoration: none;
      font-family: inherit;
    }
    .conn-pill::before {
      content: "→";
      color: var(--faint);
      font-size: 11px;
      line-height: 1;
    }
    .conn-pill:hover {
      border-color: var(--accent-line);
      background: var(--accent-soft);
      color: var(--accent);
    }
    .conn-pill:hover::before { color: var(--accent); }
    .conn-pill.no-file {
      color: var(--muted);
      font-style: italic;
    }
    .conn-empty {
      font-size: 13px;
      color: var(--faint);
      font-style: italic;
    }

    /* ==== Command palette (Cmd+K) — still wired, just not advertised ==== */
    .palette-shroud {
      position: fixed;
      inset: 0;
      background: rgba(26, 22, 18, 0.32);
      backdrop-filter: blur(2px);
      z-index: 50;
      display: none;
      align-items: flex-start;
      justify-content: center;
      padding-top: 18vh;
    }
    .palette-shroud.show { display: flex; }
    .palette {
      width: 540px;
      max-width: calc(100vw - 32px);
      background: var(--paper);
      border-radius: var(--r-lg);
      box-shadow: 0 16px 60px rgba(26,22,18,0.20);
      border: 1px solid var(--line);
      overflow: hidden;
    }
    .palette-input-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
    }
    .palette-input-row svg {
      width: 16px; height: 16px;
      color: var(--faint);
      flex-shrink: 0;
    }
    .palette-input-row input {
      flex: 1;
      font-family: inherit;
      font-size: 15px;
      color: var(--ink);
      border: none;
      outline: none;
      background: transparent;
    }
    .palette-input-row input::placeholder { color: var(--faint); }
    .palette-results {
      max-height: 400px;
      overflow-y: auto;
      padding: 6px 0;
    }
    .palette-result {
      display: grid;
      grid-template-columns: 8px 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 10px 18px;
      cursor: pointer;
      transition: background 0.1s ease;
    }
    .palette-result:hover,
    .palette-result.kbd-active { background: var(--paper-soft); }
    .palette-result .pr-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
    }
    .pr-entities  .pr-dot { background: var(--cobalt); }
    .pr-concepts  .pr-dot { background: var(--violet); }
    .pr-sources   .pr-dot { background: var(--mustard); }
    .pr-synthesis .pr-dot { background: var(--vermillion); }
    .pr-career    .pr-dot { background: var(--green-poly); }
    .pr-meta      .pr-dot { background: var(--ink-poly); }
    .palette-result .pr-title {
      font-size: 14px;
      color: var(--ink);
    }
    .palette-result .pr-path {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      color: var(--faint);
    }
    .palette-empty {
      padding: 24px 18px;
      text-align: center;
      color: var(--faint);
      font-size: 13px;
      font-style: italic;
    }

    /* ==== Help icon: keyboard hints on demand ==== */
    .help-toggle {
      position: fixed;
      right: 22px;
      bottom: 22px;
      width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--paper);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: color 0.15s ease, border-color 0.15s ease;
      z-index: 40;
    }
    .help-toggle:hover { color: var(--ink); border-color: var(--line-strong); }
    .help-popover {
      position: fixed;
      right: 22px;
      bottom: 58px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      box-shadow: 0 10px 30px rgba(26,22,18,0.12);
      padding: 14px 16px;
      font-size: 12px;
      color: var(--ink-2);
      line-height: 1.7;
      display: none;
      z-index: 40;
    }
    .help-popover.show { display: block; }
    .help-popover kbd {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      background: var(--paper-soft);
      border: 1px solid var(--line);
      padding: 1px 6px;
      border-radius: 4px;

    function fmtNum(n) { return n.toLocaleString('en-US'); }
    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }
    function tagClass(t) {
      const k = t.toLowerCase().replace(/[^a-z0-9-]/g, '-');
      return 'tag-' + k;
    }

    // ===== Build Index (left) =====
    const indexStack = document.getElementById('indexStack');

    BUCKETS.forEach(b => {
      const files = FILES.filter(f => f.bucket === b.key).sort((a, c) => c.words - a.words);
      if (!files.length) return;

      const div = document.createElement('div');
      div.className = `bucket b-${b.key}`;
      div.innerHTML = `
        <div class="bucket-head" data-bucket="${b.key}" data-label="${b.label}">
          <h3 class="bucket-name">${b.label}</h3>
          <span class="bucket-count">${files.length}</span>
        </div>
        <ul class="bucket-list">
          ${files.map(f => `
            <li class="bucket-item" data-path="${f.path}" data-title="${esc(f.title)}">
              <span>
                <span class="item-title">${esc(f.title)}</span>
                <span class="item-path">${f.path}</span>
              </span>
              <span class="item-age">${f.age}</span>
            </li>`).join('')}
        </ul>
      `;
      indexStack.appendChild(div);
    });

    // ===== Preview pane logic =====
    const preview       = document.getElementById('preview');
    const previewActive = document.getElementById('previewActive');
    let pinnedPath = null;
    let hoverTimer = null;
    const HOVER_DELAY = 200;
    const fileByPath = Object.fromEntries(FILES.map(f => [f.path, f]));

    function renderTagRow(tags) {
      if (!tags || !tags.length) return '';
      const visible = tags.slice(0, TAG_VISIBLE_LIMIT);
      const overflow = tags.slice(TAG_VISIBLE_LIMIT);
      const visibleHtml = visible.map(t => `<span class="tag ${tagClass(t)}">${esc(t)}</span>`).join('');
      const overflowHtml = overflow.length
        ? `<span class="tag tag-overflow" data-overflow="1" title="Show ${overflow.length} more">+${overflow.length} more</span>`
        : '';
      const overflowHidden = overflow.map(t =>
        `<span class="tag ${tagClass(t)}" data-overflow-tag="1" style="display:none">${esc(t)}</span>`
      ).join('');
      return visibleHtml + overflowHidden + overflowHtml;
    }

    function renderPreview(file) {
      previewActive.innerHTML = `
        <div class="preview-actions">
          <button class="more-btn" id="moreBtn" type="button">Read more</button>
          <button class="pin-btn" id="pinBtn" type="button" title="${pinnedPath === file.path ? 'Unpin' : 'Pin'}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 17v5"></path>
              <path d="M9 10.76V6a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v4.76a2 2 0 0 0 .59 1.41l1.7 1.7A1 1 0 0 1 17 15.6V16a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1v-.4a1 1 0 0 1 .29-.71l1.7-1.7A2 2 0 0 0 9 10.76Z"></path>
            </svg>
          </button>
        </div>
        <h2 class="preview-title">${esc(file.title)}</h2>
        <div class="preview-path">${file.path}</div>
        <p class="preview-excerpt">${esc(file.excerpt)}</p>
        <div class="preview-extended">${esc(file.extended)}</div>
        <div class="preview-meta-row">
          ${renderTagRow(file.tags)}
          <span class="meta-dot"></span>
          <span class="meta-text">Edited <strong>${file.age}</strong> ago</span>
          <span class="meta-dot"></span>
          <span class="meta-text"><strong>${fmtNum(file.words)}</strong> words</span>
        </div>
        <div class="preview-connect">
          <div class="connect-label">Connects to</div>
          <div class="connect-row">
            ${file.connections.length
              ? file.connections.map(c => {
                  const hasFile = !!c.target;
                  return `<button class="conn-pill ${hasFile ? '' : 'no-file'}"
                            data-target="${hasFile ? c.target : ''}">${esc(c.label)}</button>`;
                }).join('')
              : `<span class="conn-empty">No outbound links yet.</span>`}
          </div>
        </div>
      `;
      preview.classList.remove('is-expanded');
      preview.classList.add('has-file');
      preview.classList.toggle('is-pinned', pinnedPath === file.path);

      // Pin handler
      document.getElementById('pinBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        if (pinnedPath === file.path) {
          pinnedPath = null;
          preview.classList.remove('is-pinned');
        } else {
          pinnedPath = file.path;
          preview.classList.add('is-pinned');
        }
      });

      // Read more
      document.getElementById('moreBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        preview.classList.toggle('is-expanded');
      });

      // Tag overflow expand
      const overflowChip = previewActive.querySelector('.tag-overflow');
      if (overflowChip) {
        overflowChip.addEventListener('click', (e) => {
          e.stopPropagation();
          previewActive.querySelectorAll('[data-overflow-tag]').forEach(el => {
            el.style.display = '';
          });
          overflowChip.style.display = 'none';
        });
      }

      // Connection pills: hover highlights matching index row; click pins target
      previewActive.querySelectorAll('.conn-pill').forEach(p => {
        p.addEventListener('mouseenter', () => {
          const target = p.dataset.target;
          if (!target) return;
          const row = document.querySelector(`.bucket-item[data-path="${target}"]`);
          if (row) row.classList.add('conn-highlight');
        });
        p.addEventListener('mouseleave', () => {
          document.querySelectorAll('.bucket-item.conn-highlight')
                  .forEach(r => r.classList.remove('conn-highlight'));
        });
        p.addEventListener('click', (e) => {
          e.stopPropagation();
          const target = p.dataset.target;
          if (!target) return;
          const f = fileByPath[target];
          if (!f) return;
          pinnedPath = f.path;
          renderPreview(f);
          markActive(f.path);
        });
      });
    }

    function markActive(path) {
      document.querySelectorAll('.bucket-item').forEach(el => {
        el.classList.toggle('is-active', el.dataset.path === path);
      });
    }

    // Click anywhere in the preview pane (outside specific controls) acts as "open" → pin behavior
    preview.addEventListener('click', (e) => {
      if (e.target.closest('.conn-pill') || e.target.closest('.pin-btn') ||
          e.target.closest('.more-btn') || e.target.closest('.tag-overflow')) return;
      // If a file is showing and not yet pinned, pin it.
      if (preview.classList.contains('has-file') && !preview.classList.contains('is-pinned')) {
        const activeRow = document.querySelector('.bucket-item.is-active');
        if (activeRow) {
          pinnedPath = activeRow.dataset.path;
          preview.classList.add('is-pinned');
        }
      }
    });

    // Index hover/click handlers
    document.querySelectorAll('.bucket-item').forEach(el => {
      el.addEventListener('mouseenter', () => {
        if (pinnedPath) return;
        clearTimeout(hoverTimer);
        hoverTimer = setTimeout(() => {
          const file = fileByPath[el.dataset.path];
          if (file) {
            renderPreview(file);
            markActive(file.path);
          }
        }, HOVER_DELAY);
      });
      el.addEventListener('mouseleave', () => {
        clearTimeout(hoverTimer);
      });
      el.addEventListener('click', () => {
        const file = fileByPath[el.dataset.path];
        if (!file) return;
        pinnedPath = file.path;
        renderPreview(file);
        markActive(file.path);
      });
    });

    // ===== Search (in-line, left index) =====
    const searchInput = document.getElementById('searchInput');
    function runSearch(q) {
      const term = q.trim().toLowerCase();
      const items = document.querySelectorAll('.bucket-item');
      if (!term) {
        items.forEach(it => { it.classList.remove('dim'); it.classList.remove('glow'); });
        return;
      }
      items.forEach(it => {
        const file = fileByPath[it.dataset.path];
        const hay = (file.title + ' ' + file.path + ' ' + file.tags.join(' ')).toLowerCase();
        const hit = hay.includes(term);
        it.classList.toggle('glow', hit);
        it.classList.toggle('dim',  !hit);
      });
    }
    searchInput.addEventListener('input', e => runSearch(e.target.value));

    // ===== Keyboard: / focus search, Cmd+K palette, Esc =====
    const paletteShroud  = document.getElementById('paletteShroud');
    const paletteInput   = document.getElementById('paletteInput');
    const paletteResults = document.getElementById('paletteResults');

    function openPalette() {
      paletteShroud.classList.add('show');
      paletteInput.value = '';
      runPaletteSearch('');
      setTimeout(() => paletteInput.focus(), 10);
    }
    function closePalette() {
      paletteShroud.classList.remove('show');
    }
    function runPaletteSearch(q) {
      const term = q.trim().toLowerCase();
      const matches = FILES.filter(f => {
        if (!term) return true;
        const hay = (f.title + ' ' + f.path + ' ' + f.tags.join(' ')).toLowerCase();
        return hay.includes(term);
      });
      paletteResults.innerHTML = matches.length
        ? matches.map((f, i) => `
            <div class="palette-result pr-${f.bucket} ${i === 0 ? 'kbd-active' : ''}" data-path="${f.path}">
              <span class="pr-dot"></span>
              <span class="pr-title">${esc(f.title)}</span>
              <span class="pr-path">${f.path}</span>
            </div>
          `).join('')
        : `<div class="palette-empty">No matches.</div>`;

      paletteResults.querySelectorAll('.palette-result').forEach(r => {
        r.addEventListener('click', () => {
          const file = fileByPath[r.dataset.path];
          if (!file) return;
          pinnedPath = file.path;
          closePalette();
          renderPreview(file);
          markActive(file.path);
          document.getElementById('spread').scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
        r.addEventListener('mouseenter', () => {
          paletteResults.querySelectorAll('.palette-result').forEach(x => x.classList.remove('kbd-active'));
          r.classList.add('kbd-active');
        });
      });
    }
    paletteInput.addEventListener('input', e => runPaletteSearch(e.target.value));
    paletteInput.addEventListener('keydown', e => {
      const items = paletteResults.querySelectorAll('.palette-result');
      if (!items.length) return;
      let idx = [...items].findIndex(x => x.classList.contains('kbd-active'));
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        items[idx]?.classList.remove('kbd-active');
        const next = items[Math.min(idx + 1, items.length - 1)];
        next?.classList.add('kbd-active');
        next?.scrollIntoView({ block: 'nearest' });
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        items[idx]?.classList.remove('kbd-active');
        const prev = items[Math.max(idx - 1, 0)];
        prev?.classList.add('kbd-active');
        prev?.scrollIntoView({ block: 'nearest' });
      } else if (e.key === 'Enter') {
        e.preventDefault();
        const active = paletteResults.querySelector('.palette-result.kbd-active');
        active?.click();
      }
    });

    paletteShroud.addEventListener('click', e => {
      if (e.target === paletteShroud) closePalette();
    });

    document.addEventListener('keydown', e => {
      if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
        e.preventDefault();
        searchInput.focus();
        searchInput.select();
      } else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        openPalette();
      } else if (e.key === 'Escape') {
        if (paletteShroud.classList.contains('show')) closePalette();
        else if (helpPopover.classList.contains('show')) helpPopover.classList.remove('show');
        else if (document.activeElement === searchInput) {
          searchInput.value = '';
          runSearch('');
          searchInput.blur();
        }
      }
    });

    // Help popover (keyboard hints on demand)
    const helpToggle  = document.getElementById('helpToggle');
    const helpPopover = document.getElementById('helpPopover');
    helpToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      helpPopover.classList.toggle('show');
    });
    document.addEventListener('click', (e) => {
      if (!helpPopover.contains(e.target) && e.target !== helpToggle) {
        helpPopover.classList.remove('show');
      }
    });
  </script>
</body>
</html>
