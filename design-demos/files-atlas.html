<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Margins · Files · Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #faf7f2;
  --paper: #ffffff;
  --paper-soft: #f5f1ea;
  --ink: #1a1612;
  --ink-2: #4a423a;
  --muted: #847a6b;
  --line: #e8e2d6;
  --line-strong: #d8d0bf;
  --accent: #d63a2f;
  --accent-soft: rgba(214,58,47,0.10);
  --accent-line: rgba(214,58,47,0.22);

  --vermillion: #d63a2f;
  --cobalt:     #2c5aa0;
  --mustard:    #f0c14b;
  --violet:     #6a4f8c;
  --green-poly: #6fa863;
  --ink-poly:   #1a1612;

  --shadow-sm: 0 1px 0 rgba(26,22,18,0.04), 0 6px 18px rgba(26,22,18,0.04);
  --shadow-md: 0 1px 0 rgba(26,22,18,0.06), 0 12px 36px rgba(26,22,18,0.10);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  min-height: 100vh;
  background: var(--bg);
  color: var(--ink);
  font-family: "Manrope", -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

.frame {
  max-width: 1180px;
  margin: 0 auto;
  padding: 40px 36px 80px;
}

/* ---- Title strip ---- */
.title-strip {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
  padding-bottom: 18px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 22px;
}
.title-strip h1 {
  font-size: 28px;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: var(--ink);
}
.title-strip .tagline {
  color: var(--muted);
  font-size: 13.5px;
  margin-top: 4px;
  max-width: 520px;
}
.title-strip .search {
  position: relative;
  flex: 0 0 320px;
}
.title-strip .search input {
  width: 100%;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 10px 16px 10px 38px;
  font-family: inherit;
  font-size: 13.5px;
  color: var(--ink);
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.title-strip .search input:focus {
  border-color: var(--accent-line);
  box-shadow: 0 0 0 4px var(--accent-soft);
}
.title-strip .search svg {
  position: absolute;
  left: 14px; top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
}

/* ---- Map panel ---- */
.map-panel {
  position: relative;
  background: linear-gradient(180deg, #fdfbf7 0%, #f8f4ec 100%);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 18px 22px 16px;
  height: 340px;
  margin-bottom: 28px;
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}
.map-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 4px;
  position: relative;
  z-index: 2;
}
.map-header .label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}
.map-header .label::before {
  content: "";
  width: 6px; height: 6px;
  border-radius: 999px;
  background: var(--vermillion);
}
.map-header .legend {
  display: flex;
  gap: 14px;
  font-size: 11.5px;
  color: var(--muted);
}
.map-header .legend span {
  display: inline-flex; align-items: center; gap: 5px;
}
.map-header .legend i {
  width: 8px; height: 8px; border-radius: 999px;
  display: inline-block;
}

.map-svg {
  position: absolute;
  inset: 38px 0 0 0;
  width: 100%;
}
.map-svg .grid-dot { fill: #e2dccc; }
.map-svg .edge {
  stroke: #c8c1b6;
  stroke-width: 1;
  opacity: 0.55;
  transition: opacity 0.2s, stroke 0.2s, stroke-width 0.2s;
  pointer-events: none;
}
.map-svg .edge.highlight {
  stroke: var(--ink);
  stroke-width: 1.6;
  opacity: 0.95;
}
.map-svg .edge.dim { opacity: 0.12; }

.map-svg .node {
  cursor: pointer;
  transition: transform 0.15s;
}
.map-svg .node circle.ring {
  fill: var(--paper);
  stroke: #e2dccc;
  stroke-width: 1.2;
  transition: stroke 0.18s, stroke-width 0.18s;
}
.map-svg .node circle.dot {
  transition: transform 0.18s, filter 0.18s;
  transform-origin: center;
}
.map-svg .node:hover circle.ring,
.map-svg .node.active circle.ring {
  stroke: var(--ink);
  stroke-width: 1.6;
}
.map-svg .node.active circle.dot {
  filter: drop-shadow(0 2px 6px rgba(26,22,18,0.20));
}
.map-svg .node.dim { opacity: 0.30; }
.map-svg .node text.label {
  font-family: "Manrope", sans-serif;
  font-size: 10.5px;
  fill: var(--ink-2);
  font-weight: 500;
  pointer-events: none;
  user-select: none;
}
.map-svg .node.hub text.label {
  fill: var(--muted);
  font-style: italic;
}

/* tooltip */
.map-tooltip {
  position: absolute;
  pointer-events: none;
  background: var(--ink);
  color: #fdf9f1;
  padding: 9px 12px;
  border-radius: 10px;
  font-size: 12px;
  line-height: 1.4;
  max-width: 240px;
  box-shadow: var(--shadow-md);
  opacity: 0;
  transform: translate(-50%, calc(-100% - 10px));
  transition: opacity 0.12s;
  z-index: 5;
  white-space: nowrap;
}
.map-tooltip.show { opacity: 1; }
.map-tooltip .t-title { font-weight: 600; }
.map-tooltip .t-meta { color: #c8bfaf; font-size: 11px; margin-top: 2px; }
.map-tooltip::after {
  content: "";
  position: absolute;
  bottom: -5px; left: 50%;
  transform: translateX(-50%) rotate(45deg);
  width: 9px; height: 9px;
  background: var(--ink);
  border-radius: 1px;
}

/* ---- Filter bar ---- */
.filter-bar {
  position: sticky;
  top: 0;
  z-index: 3;
  background: var(--bg);
  padding: 12px 0 10px;
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid var(--line);
}
.filter-bar .count {
  font-size: 12px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.filter-bar .count b { color: var(--ink); font-weight: 600; }
.filter-bar .chips { display: flex; gap: 8px; flex: 1; }
.filter-chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 5px 10px 5px 12px;
  background: var(--ink);
  color: #fdf9f1;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 500;
}
.filter-chip button {
  background: none; border: none; cursor: pointer;
  color: #c8bfaf;
  font-size: 13px;
  line-height: 1;
  padding: 0;
}
.filter-chip button:hover { color: #fff; }
.show-all {
  background: none;
  border: 1px solid var(--line);
  color: var(--ink-2);
  font-family: inherit;
  font-size: 12px;
  font-weight: 500;
  padding: 5px 12px;
  border-radius: 999px;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
}
.show-all:hover { border-color: var(--line-strong); background: var(--paper); }

/* ---- File list ---- */
.file-list {
  display: flex;
  flex-direction: column;
}
.file-row {
  display: grid;
  grid-template-columns: 16px 1fr auto;
  gap: 14px;
  padding: 14px 4px 14px 0;
  border-bottom: 1px solid var(--line);
  cursor: pointer;
  transition: background 0.12s;
}
.file-row:hover { background: rgba(26,22,18,0.018); }
.file-row.hidden { display: none; }

.swatch {
  width: 6px;
  height: 100%;
  min-height: 36px;
  border-radius: 999px;
  margin-top: 2px;
  margin-left: 4px;
}

.file-main { min-width: 0; }
.file-title-row {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 3px;
}
.file-title {
  font-size: 14.5px;
  font-weight: 600;
  color: var(--ink);
  letter-spacing: -0.005em;
}
.file-path {
  font-size: 11.5px;
  color: var(--muted);
  font-family: "JetBrains Mono", "Menlo", monospace;
  font-weight: 400;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.file-snippet {
  color: var(--ink-2);
  font-size: 13px;
  line-height: 1.45;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 8px;
}
.file-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.chip {
  font-size: 11px;
  color: var(--muted);
  background: var(--paper);
  border: 1px solid var(--line);
  padding: 2px 8px;
  border-radius: 999px;
  font-weight: 500;
}
.chip.link {
  background: var(--accent-soft);
  border-color: var(--accent-line);
  color: var(--accent);
}
.chip.bucket {
  text-transform: lowercase;
  letter-spacing: 0.02em;
}

.file-meta {
  text-align: right;
  white-space: nowrap;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 2px;
  font-variant-numeric: tabular-nums;
}
.file-meta .time {
  font-size: 12.5px;
  color: var(--ink-2);
  font-weight: 500;
}
.file-meta .words {
  font-size: 11.5px;
  color: var(--muted);
}

.empty-state {
  padding: 40px 0;
  text-align: center;
  color: var(--muted);
  font-size: 13px;
}
.empty-state.hidden { display: none; }
</style>
</head>
<body>
<div class="frame">

  <!-- Title strip -->
  <header class="title-strip">
    <div>
      <h1>Files</h1>
      <div class="tagline">An atlas of your thinking. Drag a node, follow a thread, pull what you need.</div>
    </div>
    <div class="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="search-input" type="text" placeholder="Search files, tags, people…" />

  </header>

  <!-- Map panel -->
  <section class="map-panel">

</div>

<script>

// ----- Edges (undirected; ids reference NODES)
const EDGES = [
  ["alex-wolf","morgan-stanley"],
  ["alex-wolf","briefly"],
  ["morgan-stanley","joel-florczyk"],
  ["ellis-rutili","centric-wm"],
  ["ellis-rutili","virgil-rutili"],

// ----- Files (the flat list)

  { id: "alex-wolf",          path: "wiki/career/alex-wolf.md",                            bucket: "career",    title: "Alex Wolf",                                  words: 380,  ago: "2h",  tags: ["career","advisor"],
    snippet: "Old MS colleague turned RIA advisor. Warm contact, kept the relationship alive after the desk split. Useful read on how mid-tier firms are absorbing AI tooling.",
    links: ["briefly","morgan-stanley"] },
  { id: "morgan-stanley",     path: "wiki/career/morgan-stanley.md",                       bucket: "career",    title: "Morgan Stanley",                             words: 1240, ago: "2d",  tags: ["career"],

    links: [] },
];

// ----- Build graph SVG
const svg = document.getElementById("map-svg");
const SVG_NS = "http://www.w3.org/2000/svg";

// soft grid of dots
const gridLayer = document.createElementNS(SVG_NS, "g");
for (let x = 30; x < 1080; x += 36) {
  for (let y = 20; y < 285; y += 36) {
    const d = document.createElementNS(SVG_NS, "circle");
    d.setAttribute("cx", x);
    d.setAttribute("cy", y);
    d.setAttribute("r", 0.9);
    d.setAttribute("class", "grid-dot");
    gridLayer.appendChild(d);
  }
}
svg.appendChild(gridLayer);

// edges
const edgeLayer = document.createElementNS(SVG_NS, "g");
const edgeMap = new Map();
EDGES.forEach(([a, b]) => {
  const A = NODES.find(n => n.id === a);
  const B = NODES.find(n => n.id === b);
  if (!A || !B) return;
  const line = document.createElementNS(SVG_NS, "line");
  line.setAttribute("x1", A.x);
  line.setAttribute("y1", A.y);
  line.setAttribute("x2", B.x);
  line.setAttribute("y2", B.y);
  line.setAttribute("class", "edge");
  edgeLayer.appendChild(line);
  if (!edgeMap.has(a)) edgeMap.set(a, []);
  if (!edgeMap.has(b)) edgeMap.set(b, []);
  edgeMap.get(a).push({ other: b, el: line });
  edgeMap.get(b).push({ other: a, el: line });
});
svg.appendChild(edgeLayer);

// nodes
const nodeLayer = document.createElementNS(SVG_NS, "g");
const nodeEls = new Map();
NODES.forEach(n => {
  const r = 5 + Math.min(14, Math.sqrt(n.words) / 6.5);
  const g = document.createElementNS(SVG_NS, "g");
  g.setAttribute("class", "node" + (n.hub ? " hub" : ""));
  g.setAttribute("data-id", n.id);
  g.setAttribute("transform", `translate(${n.x},${n.y})`);

  const ring = document.createElementNS(SVG_NS, "circle");
  ring.setAttribute("class", "ring");
  ring.setAttribute("r", r + 3);
  g.appendChild(ring);

  const dot = document.createElementNS(SVG_NS, "circle");
  dot.setAttribute("class", "dot");
  dot.setAttribute("r", r);
  dot.setAttribute("fill", BUCKET_COLOR[n.bucket] || "#999");
  if (n.hub) {
    dot.setAttribute("fill-opacity", "0.32");
    dot.setAttribute("stroke", BUCKET_COLOR[n.bucket]);
    dot.setAttribute("stroke-width", "1");
    dot.setAttribute("stroke-dasharray", "2 2");
  }
  g.appendChild(dot);

  const label = document.createElementNS(SVG_NS, "text");
  label.setAttribute("class", "label");
  label.setAttribute("y", r + 14);
  label.setAttribute("text-anchor", "middle");
  label.textContent = n.label;
  g.appendChild(label);

  nodeLayer.appendChild(g);
  nodeEls.set(n.id, g);
});
svg.appendChild(nodeLayer);

// ----- Tooltip
const tooltip = document.getElementById("map-tooltip");
const mapPanel = document.querySelector(".map-panel");

function showTooltip(node, evt) {
  const rect = mapPanel.getBoundingClientRect();
  const svgRect = svg.getBoundingClientRect();
  const scale = svgRect.width / 1100;
  const px = svgRect.left - rect.left + node.x * scale;
  const py = svgRect.top - rect.top + node.y * scale;
  tooltip.style.left = px + "px";
  tooltip.style.top = py + "px";
  const file = FILES.find(f => f.id === node.file);
  tooltip.querySelector(".t-title").textContent = node.label;
  let meta = node.bucket;
  if (file) meta += ` · ${file.words.toLocaleString()} words · ${file.ago}`;
  else if (node.hub) meta += " · hub (no file)";
  tooltip.querySelector(".t-meta").textContent = meta;
  tooltip.classList.add("show");
}
function hideTooltip() { tooltip.classList.remove("show"); }

// ----- Selection / hover state
let activeNode = null;

function neighborsOf(id) {
  const set = new Set([id]);
  (edgeMap.get(id) || []).forEach(e => set.add(e.other));
  return set;
}

function applyHighlight(id) {
  const keep = neighborsOf(id);
  nodeEls.forEach((el, key) => {
    if (keep.has(key)) el.classList.remove("dim");
    else el.classList.add("dim");
  });
  Array.from(edgeLayer.children).forEach(line => line.classList.add("dim"));
  (edgeMap.get(id) || []).forEach(e => {
    e.el.classList.remove("dim");
    e.el.classList.add("highlight");
  });
}
function clearHighlight() {
  nodeEls.forEach(el => el.classList.remove("dim"));
  Array.from(edgeLayer.children).forEach(line => {
    line.classList.remove("dim");
    line.classList.remove("highlight");
  });
}

nodeEls.forEach((el, id) => {
  const node = NODES.find(n => n.id === id);
  el.addEventListener("mouseenter", (e) => {
    showTooltip(node, e);
    if (!activeNode) applyHighlight(id);
  });
  el.addEventListener("mouseleave", () => {
    hideTooltip();
    if (!activeNode) clearHighlight();
  });
  el.addEventListener("click", () => {
    if (activeNode === id) {
      // toggle off
      activeNode = null;
      el.classList.remove("active");
      clearHighlight();
      setFilter(null);
    } else {
      // clear previous
      if (activeNode) nodeEls.get(activeNode)?.classList.remove("active");
      activeNode = id;
      el.classList.add("active");
      applyHighlight(id);
      setFilter(id);
    }
  });
});

// ----- Render file list
const listEl = document.getElementById("file-list");
const visibleCountEl = document.getElementById("visible-count");
const filterChipsEl = document.getElementById("filter-chips");
const showAllBtn = document.getElementById("show-all");
const emptyEl = document.getElementById("empty-state");
const searchInput = document.getElementById("search-input");

function bucketColor(b) { return BUCKET_COLOR[b] || "#999"; }

function rowHtml(f) {
  const links = f.links.map(l => {
    const node = NODES.find(n => n.id === l);
    const label = node ? node.label : l;
    return `<span class="chip link" data-link="${l}">${label}</span>`;
  }).join("");
  const tags = f.tags.map(t => `<span class="chip">${t}</span>`).join("");
  return `
    <div class="file-row" data-id="${f.id}">
      <div class="swatch" style="background:${bucketColor(f.bucket)}"></div>
      <div class="file-main">
        <div class="file-title-row">
          <div class="file-title">${f.title}</div>
          <div class="file-path">${f.path}</div>
        </div>
        <div class="file-snippet">${f.snippet}</div>
        <div class="file-chips">
          <span class="chip bucket" style="color:${bucketColor(f.bucket)};border-color:${bucketColor(f.bucket)}33">${f.bucket}</span>
          ${tags}${links}
        </div>
      </div>
      <div class="file-meta">
        <div class="time">${f.ago}</div>
        <div class="words">${f.words.toLocaleString()} words</div>
      </div>
    </div>
  `;
}

listEl.innerHTML = FILES.map(rowHtml).join("");

// ----- Filtering
let currentFilter = null;
let currentSearch = "";

function fileMatchesFilter(f) {
  if (!currentFilter) return true;
  // Files "about" the filtered node = file itself + files that connect to it.
  const fid = currentFilter;
  if (f.id === fid) return true;
  if (f.links && f.links.includes(fid)) return true;
  // If the filtered node is itself a file, include files linked to that file
  const node = NODES.find(n => n.id === fid);
  if (node && node.file === f.id) return true;
  return false;
}

function fileMatchesSearch(f) {
  if (!currentSearch) return true;
  const q = currentSearch.toLowerCase();
  return (
    f.title.toLowerCase().includes(q) ||
    f.path.toLowerCase().includes(q) ||
    f.snippet.toLowerCase().includes(q) ||
    f.tags.some(t => t.toLowerCase().includes(q)) ||
    f.links.some(l => l.toLowerCase().includes(q))
  );
}

function renderList() {
  let visible = 0;
  document.querySelectorAll(".file-row").forEach(row => {
    const id = row.dataset.id;
    const f = FILES.find(x => x.id === id);
    const show = fileMatchesFilter(f) && fileMatchesSearch(f);
    row.classList.toggle("hidden", !show);
    if (show) visible++;
  });
  visibleCountEl.textContent = visible;
  emptyEl.classList.toggle("hidden", visible !== 0);

  // chips
  filterChipsEl.innerHTML = "";
  if (currentFilter) {
    const node = NODES.find(n => n.id === currentFilter);
    const chip = document.createElement("span");
    chip.className = "filter-chip";
    chip.innerHTML = `Filtering: ${node ? node.label : currentFilter} <button aria-label="clear">×</button>`;
    chip.querySelector("button").addEventListener("click", () => setFilter(null));
    filterChipsEl.appendChild(chip);
    showAllBtn.hidden = false;
  } else {
    showAllBtn.hidden = true;
  }
}

function setFilter(nodeId) {
  currentFilter = nodeId;
  if (!nodeId && activeNode) {
    nodeEls.get(activeNode)?.classList.remove("active");
    activeNode = null;
    clearHighlight();
  }
  renderList();
}

showAllBtn.addEventListener("click", () => setFilter(null));

searchInput.addEventListener("input", (e) => {
  currentSearch = e.target.value.trim();
  renderList();
});

// Link chips in the list also filter
listEl.addEventListener("click", (e) => {
  const linkEl = e.target.closest(".chip.link");
  if (linkEl) {
    e.stopPropagation();
    const id = linkEl.dataset.link;
    if (nodeEls.has(id)) {
      if (activeNode) nodeEls.get(activeNode)?.classList.remove("active");
      activeNode = id;
      nodeEls.get(id).classList.add("active");
      applyHighlight(id);
      setFilter(id);
      mapPanel.scrollIntoView({ behavior: "smooth", block: "start" });
    }
    return;
  }
  const row = e.target.closest(".file-row");
  if (row) {
    // would navigate to the file; out of scope for this demo
    row.style.transition = "background 0.12s";
    row.style.background = "var(--accent-soft)";
    setTimeout(() => { row.style.background = ""; }, 220);
  }
});

renderList();
</script>
</body>
</html>
