name: Release

# Triggered on version tags. Bump versions locally with `npm version <x>` (which
# syncs package.json, mcpb/manifest.json, and server.json via the version
# lifecycle), then push tags. This workflow does the rest: tests, npm publish
# via trusted publishing, MCP registry publish via OIDC, and the .mcpb release.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write   # create GitHub Release
  id-token: write   # OIDC for npm trusted publishing AND mcp-publisher

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify release metadata sync
        run: npm run check:release-sync

      - name: Verify tag matches package version
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          TAG_VER="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VER" != "$TAG_VER" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $PKG_VER"
            exit 1
          fi
          echo "Tag and package version in sync: $PKG_VER"
          echo "version=$PKG_VER" >> "$GITHUB_OUTPUT"
        id: version

      - name: Build .mcpb bundle
        run: ./scripts/build-mcpb.sh

      - name: Publish to npm (trusted publishing via OIDC)
        run: npm publish --access public

      - name: Verify npm package metadata is live
        run: |
          node <<'NODE'
          const { readFileSync } = await import("node:fs");
          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          const url = `https://registry.npmjs.org/${pkg.name}/${pkg.version}`;

          for (let attempt = 1; attempt <= 24; attempt++) {
            try {
              const res = await fetch(url);
              if (res.ok) {
                const meta = await res.json();
                if (meta.mcpName === pkg.mcpName) {
                  console.log(`${pkg.name}@${pkg.version} is live with mcpName=${pkg.mcpName}`);
                  process.exit(0);
                }
                console.log(`attempt ${attempt}: package live but mcpName=${meta.mcpName || "<missing>"}`);
              } else {
                console.log(`attempt ${attempt}: ${res.status} from npm registry`);
              }
            } catch (err) {
              console.log(`attempt ${attempt}: ${err.message}`);
            }

            await new Promise((resolve) => setTimeout(resolve, 5000));
          }

          console.error(`npm metadata for ${pkg.name}@${pkg.version} did not become registry-ready`);
          process.exit(1);
          NODE

      - name: Install mcp-publisher
        run: |
          curl -sL https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin mcp-publisher
          mcp-publisher --version

      - name: Publish to MCP registry (GitHub OIDC)
        run: |
          mcp-publisher login github-oidc
          mcp-publisher publish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Attach both the versioned bundle and the unversioned copy. The
          # unversioned filename gives margins.app a stable direct-download URL:
          # https://github.com/cflorczyk9/Margins/releases/latest/download/margins-mcp.mcpb
          files: |
            dist/margins-mcp-*.mcpb
            dist/margins-mcp.mcpb
          generate_release_notes: true
          body: |
            ## Install

            **Claude Desktop (recommended):** download `margins-mcp-*.mcpb` below and double-click.

            **Claude Code / CLI:** `npm install -g margins-mcp@${{ steps.version.outputs.version }}` then `margins-mcp install`.

            **Already installed?** Margins surfaces an update hint in `margins_start` automatically. Run `margins-mcp install --update` (npm) or re-download the .mcpb (Desktop) when you see it.
